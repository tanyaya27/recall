<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Photograph where you put things. Ask later, get the photo back." />

  <!-- Home-screen app. iOS reads the apple-* tags; everything else reads the manifest. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ReCall" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F6F1E8" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" href="./icon-192.png" type="image/png" />

  <title>ReCall</title>
  <link rel="stylesheet" href="./styles.css?v=20260905g" />
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
      "firebase/app": "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>
  <div id="root"><div class="boot boot-static">Opening ReCall…</div></div>
  <script>
    // If the app's code has not replaced this placeholder in 6s, the script itself never
    // ran (CDN import blocked, a cached broken build, or an exception before render). Say
    // exactly that — it is a different problem from a slow sign-in, which the app reports
    // itself — and offer a fresh load with a new query so nothing cached is reused.
    setTimeout(function () {
      var el = document.querySelector('#root .boot-static');
      if (!el) return;
      el.innerHTML = 'Opening ReCall…<div style="margin:20px auto 0;max-width:20rem;font-size:17px">The app\u2019s code did not start on this open.' +
        '<br><button style="margin-top:12px;font:inherit;font-size:19px;padding:14px 20px;border:0;border-radius:18px;background:#E4EEEA;color:#2F6B5E;font-weight:600" ' +
        'onclick="location.replace(location.pathname+\'?v=\'+Date.now())">Try again</button></div>';
      try { localStorage.setItem('recall-last-boot', JSON.stringify({ startedAt: Date.now(), stages: [{ stage: 'script-never-ran', ms: 6000 }] })); } catch (e) {}
    }, 6000);
  </script>
  <script type="module" src="./app.js?v=20260905g"></script>
  <script>
    // SERVICE WORKER DELIBERATELY DISABLED (2026-09-05).
    //
    // Requests to the AI provider fail on iPhone with a bare "Load failed" while the exact
    // same request from the same origin succeeds in a desktop browser. The service worker
    // is the newest thing in the request path and iOS is the platform where workers are
    // flakiest, so it goes first — an offline shell is not worth an app that cannot think.
    // This actively unregisters any worker already installed on a device.
    // If the failure survives this, the cause is the device or the network, not our code.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((rs) => rs.forEach((r) => r.unregister()))
        .catch(() => {});
      if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
    }
  </script>
</body>
</html>
